<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pretty To-Do App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Poppins", sans-serif;
        }

        .todo-card {
            background: #fff;
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            padding: 25px 20px;
        }

        .todo-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .todo-header h2 {
            font-weight: 600;
            color: #6a11cb;
        }

        .input-group input {
            border-radius: 10px 0 0 10px !important;
        }

        .input-group button {
            border-radius: 0 10px 10px 0 !important;
        }

        .task-list {
            margin-top: 20px;
        }

        .task-item {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .task-item:hover {
            background: #e8e8e8;
        }

        .task-text {
            flex: 1;
            margin: 0 10px;
        }

        .task-btns button {
            border: none;
            background: none;
            cursor: pointer;
        }

        .task-btns button i {
            font-size: 18px;
            color: #6a11cb;
            transition: 0.2s;
        }

        .task-btns button i:hover {
            color: #a4508b;
        }

        .empty-text {
            text-align: center;
            color: gray;
            margin-top: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="todo-card">
        <div class="todo-header">
            <h2>My To-Do List 📝</h2>
        </div>

        <!-- Input Field -->
        <div class="input-group mb-3">
            <input type="text" class="form-control task-input" placeholder="Add a new task..." />
            <button class="add-btn btn btn-primary ">Add</button>
        </div>

        <!-- Task List -->
        <div class="task-list">
            <p class="empty-text">No tasks yet! Add your first one 🌟</p>
            <!-- Example of a task item -->

            <div class="task-item">
                <input type="checkbox" class="form-check-input" />
                <p class="task-text">Example Task</p>
                <div class="task-btns">
                    <button class="edit-btn border  border-secondary mx-2 rounded-2"><i class="bi bi-pencil"></i></button>
                    <button class="delete-btn border  border-secondary mx-2 rounded-2"><i class="bi bi-trash"></i></button>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS + Icons -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <!-- SWEET ALERT -->
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const addbtn = document.querySelector(".add-btn")
        const taskInput = document.querySelector(".task-input")
        const taskList = document.querySelector(".task-list");
        const editbtn = document.querySelector(".edit-btn")
        const deletebtn = document.querySelector(".delete-btn")

       addbtn.addEventListener("click", function () {
    if (taskInput.value.trim() === "") {
        Swal.fire({
          icon: 'error',
          title: 'Oops...',
          text: 'Please enter a task!',
        });
    } else {
        taskList.innerHTML += `
        <div class="task-item">
            <input type="checkbox" class="form-check-input" />
            <p class="task-text">${taskInput.value}</p>
            <div class="task-btns">
                <button class="edit-btn border border-secondary mx-2 rounded-2"><i class="bi bi-pencil"></i></button>
                <button class="delete-btn border border-secondary mx-2 rounded-2"><i class="bi bi-trash"></i></button>
            </div>
        </div>
        `;

        Swal.fire({
          icon: 'success',
          title: 'Task Added!',
          text: `Your task "${taskInput.value}" has been added.`,
          showConfirmButton: false,
          timer: 1500
        });

        taskInput.value = ""; // clear input
    }
});

// EDIT BUTTON

    </script>
</body>

</html>
