<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pretty To-Do App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Poppins", sans-serif;
        }

        .todo-card {
            background: #fff;
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            padding: 25px 20px;
        }

        .todo-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .todo-header h2 {
            font-weight: 600;
            color: #6a11cb;
        }

        .add-btn {
            background-color: #AA92D4;
        }

        .add-btn:hover {
            color: white;
            background-color: #6a11cb;
        }

        .input-group input {
            border-radius: 10px 0 0 10px !important;
        }

        .input-group button {
            border-radius: 0 10px 10px 0 !important;
        }

        .task-list {
            margin-top: 20px;
        }

        .task-item {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .task-item:hover {
            background: #e8e8e8;
        }

        .task-text {
            flex: 1;
            margin: 0 10px;
        }

        .task-btns button {
            border: none;
            background: none;
            cursor: pointer;
        }

        .task-btns button i {
            font-size: 18px;
            color: #6a11cb;
            transition: 0.2s;
        }

        .task-btns button i:hover {
            color: #a4508b;
        }

        .empty-text {
            text-align: center;
            color: gray;
            margin-top: 15px;
            font-size: 0.9rem;
        }

    </style>
</head>

<body>
    <div class="todo-card">
        <div class="todo-header">
            <h2>My To-Do List 📝</h2>
        </div>

        <!-- Input Field -->
        <form action="#">
            <div class="input-group mb-3">
                <input type="text" class="form-control task-input" placeholder="Add a new task..." />
                <button class="add-btn btn" type="submit">Add</button>
            </div>
        </form>

        <!-- Task List -->
        <div class="task-list">
            <p class="empty-text">No tasks yet! Add your first one 🌟</p>

            <div class="task-item">
                <input type="checkbox" class="form-check-input" />
                <p class="task-text">Example Task</p>
                <div class="task-btns">
                    <button class="edit-btn border border-secondary mx-2 rounded-2"><i
                            class="bi bi-pencil"></i></button>
                    <button class="delete-btn border border-secondary mx-2 rounded-2"><i
                            class="bi bi-trash"></i></button>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS + Icons -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <!-- SWEET ALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const addbtn = document.querySelector(".add-btn");
        const taskInput = document.querySelector(".task-input");
        const taskList = document.querySelector(".task-list");

        // 🧠 Prevent form reload + support Enter key
        document.querySelector("form").addEventListener("submit", function (e) {
            e.preventDefault();
            addbtn.click(); // run same add function
        });

        // Function to update task count
        function updateTaskCount() {
            const allTasks = taskList.querySelectorAll(".task-item");
            const emptyText = taskList.querySelector(".empty-text"); // select fresh
            let taskCount = 0;

            allTasks.forEach(task => {
                const text = task.querySelector(".task-text").textContent.trim();
                if (text !== "Example Task") taskCount++;
            });

            if (taskCount === 0) {
                emptyText.textContent = "No tasks yet! Add your first one 🌟";
            } else {
                emptyText.textContent = `You have ${taskCount} task${taskCount > 1 ? "s" : ""} 🤗`;
            }
        }

        // ADD NEW TASKS
        addbtn.addEventListener("click", function () {
            const value = taskInput.value.trim();
            if (!value) {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: 'Please enter a task!',
                });
                return;
            }

            taskList.innerHTML += `
            <div class="task-item">
                <input type="checkbox" class="form-check-input" />
                <p class="task-text">${value}</p>
                <div class="task-btns">
                    <button class="edit-btn border border-secondary mx-2 rounded-2"><i class="bi bi-pencil"></i></button>
                    <button class="delete-btn border border-secondary mx-2 rounded-2"><i class="bi bi-trash"></i></button>
                </div>
            </div>
        `;

            Swal.fire({
                icon: 'success',
                title: 'Task Added!',
                text: `Your task "${value}" has been added.`,
                showConfirmButton: false,
                timer: 1500
            });

            taskInput.value = "";
            updateTaskCount();
        });

        // EVENT DELEGATION FOR EDIT & DELETE
        taskList.addEventListener("click", function (e) {
            const taskItem = e.target.closest(".task-item");
            if (!taskItem) return;

            // DELETE
            if (e.target.closest(".delete-btn")) {
                taskItem.remove();
                Swal.fire({
                    icon: 'success',
                    title: 'Deleted!',
                    text: 'Task has been deleted.',
                    showConfirmButton: false,
                    timer: 1200
                });
                updateTaskCount();
            }

            // EDIT
            if (e.target.closest(".edit-btn")) {
                const taskText = taskItem.querySelector(".task-text");
                Swal.fire({
                    title: 'Edit your task',
                    input: 'text',
                    inputValue: taskText.textContent,
                    showCancelButton: true,
                    confirmButtonText: 'Save',
                    cancelButtonText: 'Cancel',
                    inputValidator: (value) => {
                        if (!value.trim()) return 'Task cannot be empty!';
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        taskText.textContent = result.value;
                        Swal.fire({
                            icon: 'success',
                            title: 'Edited!',
                            text: 'Task has been updated.',
                            showConfirmButton: false,
                            timer: 1200
                        });
                        updateTaskCount();
                    }
                });
            }
        });

        // Initial count
        updateTaskCount();
    </script>
</body>

</html>
