<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pretty To-Do App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- EXTERNAL CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="todo-card">
        <div class="todo-header">
            <h2>My To-Do List 📝</h2>
        </div>

        <!-- Input Field -->
        <form action="#">
            <div class="input-group mb-3">
                <input type="text" class="form-control task-input" placeholder="Add a new task..." />
                <button class="add-btn btn" type="submit">Add</button>
            </div>
        </form>

        <!-- Task List -->
        <div class="task-list">
            <p class="empty-text">No tasks yet! Add your first one 🌟</p>

            <div class="task-item">
                <input type="checkbox" class="form-check-input" />
                <p class="task-text">Example Task</p>
                <div class="task-btns">
                    <button class="edit-btn border border-secondary mx-2 rounded-2"><i
                            class="bi bi-pencil"></i></button>
                    <button class="delete-btn border border-secondary mx-2 rounded-2"><i
                            class="bi bi-trash"></i></button>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS + Icons -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <!-- SWEET ALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- CUSTOM EXTERNAL JS -->
<script src="app.js"></script>     
</body>

</html>
