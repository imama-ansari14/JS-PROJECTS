<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-image {
            background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1470&q=80') no-repeat center center;
            background-size: cover;
            height: 100vh;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #result img {
            border-radius: 0.5rem;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <div class="bg-image">
        <div class="overlay">
            <div class="card p-4 shadow-lg text-center" style="max-width: 700px; width: 100%;">
                <h1 class="mb-4">🍳 Recipe Finder</h1>

                <form action="#">
                    <div class="input-group mb-3">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search for a recipe...">
                        <button id="searchBtn" class="btn btn-danger" type="button">Search</button>
                    </div>
                </form>

                <div id="result" class="mt-3 text-start"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SWEET ALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- CUSTOM JS -->
    <script src="script.js"></script>
</body>

</html>
